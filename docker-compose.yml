version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: emaildb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  email-producer:
    build:
      context: .
      dockerfile: email-producer/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - mysql
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: emaildb
      DB_USER: root
      DB_PASSWORD: root

  email-consumer:
    build:
      context: .
      dockerfile: email-consumer/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - mysql
      - mailhog
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: emaildb
      DB_USER: root
      DB_PASSWORD: root
      MAIL_HOST: mailhog
      MAIL_PORT: 1025

volumes:
  mysql-data:
