version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zk
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_DATABASE=emaildb
      - MYSQL_USER=email
      - MYSQL_PASSWORD=email123
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  email-producer:
    build:
      context: .
      dockerfile: email-producer/Dockerfile
    depends_on:
      - kafka
      - mysql
      - mailhog
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=emaildb
      - DB_USER=email
      - DB_PASSWORD=email123
      - KAFKA_BOOTSTRAP=kafka:9092
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    ports:
      - "8080:8080"

  email-consumer:
    build:
      context: .
      dockerfile: email-consumer/Dockerfile
    depends_on:
      - kafka
      - mysql
      - mailhog
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=emaildb
      - DB_USER=email
      - DB_PASSWORD=email123
      - KAFKA_BOOTSTRAP=kafka:9092
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    ports:
      - "8081:8081"
